name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No real keys anywhere: tests use recorded fixtures and the mock model.
jobs:
  python:
    name: Python service (lint, unit, integration, security)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: intelligence-service/uv.lock
      - name: Local settings for the compose services (placeholders only)
        run: cp .env.example .env
      - name: Start Memgraph (development and disposable test instances) and PostgreSQL
        run: docker compose --profile test up -d --wait memgraph memgraph-test postgres
      - name: Install
        working-directory: intelligence-service
        run: uv sync --frozen
      - name: Lint
        working-directory: intelligence-service
        run: uv run ruff check .
      - name: Unit and integration tests
        working-directory: intelligence-service
        run: uv run pytest -q
      - name: Security tests (tenant isolation, JWT tampering, malformed input)
        working-directory: intelligence-service
        run: uv run pytest ../tests/security -c pyproject.toml --rootdir . -q
      - name: Agent evaluation with the mock model (seed graph plus the recorded real CVE)
        run: |
          docker compose --profile migrate run --rm flyway
          cd intelligence-service
          uv run python -m ingestion.seed_loader --reset
          uv run python -m ingestion.demo_data --offline
          uv run python -m agent.evaluation --provider mock
      - name: Container logs on failure
        if: failure()
        run: docker compose --profile test logs --no-color --tail 100

  backend:
    name: Spring Boot backend (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test (Testcontainers starts PostgreSQL)
        working-directory: backend
        run: ./mvnw -B -ntp test
      - name: OpenAPI file is up to date
        run: git diff --exit-code docs/api/openapi.json
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire
          path: backend/target/surefire-reports

  frontend:
    name: Web UI (lint, types, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - name: Build
        run: pnpm build
        env:
          NEXTAUTH_SECRET: ci-build-only-not-a-secret

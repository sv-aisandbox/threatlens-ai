# Local infrastructure for ThreatLens AI.
# All ports are bound to 127.0.0.1 only; never expose these databases publicly.
# Credentials come from .env (copy .env.example). Image tags are pinned (see ADR 0001).

name: threatlens

services:
  memgraph:
    image: memgraph/memgraph-mage:3.14.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEMGRAPH_PORT:-7687}:7687"
    volumes:
      - memgraph_data:/var/lib/memgraph
    networks: [threatlens]
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --output-format=csv | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: postgres:17.12
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [threatlens]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Disposable Memgraph for automated tests (no volume). Start with `--profile test`.
  memgraph-test:
    image: memgraph/memgraph-mage:3.14.0
    profiles: [test]
    ports:
      - "127.0.0.1:7688:7687"
    networks: [threatlens]
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --output-format=csv | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Applies database/migrations to PostgreSQL: `docker compose --profile migrate run --rm flyway`
  flyway:
    image: flyway/flyway:13.13.0
    profiles: [migrate]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      FLYWAY_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    command: migrate
    volumes:
      - ./database/migrations:/flyway/sql:ro
    networks: [threatlens]

  # Local OIDC provider (dummy users only). Start with `docker compose --profile auth up -d --wait keycloak`.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    profiles: [auth]
    command: ["start-dev", "--import-realm", "--hostname=http://127.0.0.1:8081", "--http-enabled=true", "--health-enabled=true"]
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./auth/keycloak:/opt/keycloak/data/import:ro
    networks: [threatlens]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Optional UI: start with `docker compose --profile lab up -d`
  memgraph-lab:
    image: memgraph/lab:3.14.3
    profiles: [lab]
    restart: unless-stopped
    depends_on:
      memgraph:
        condition: service_healthy
    environment:
      QUICK_CONNECT_MG_HOST: memgraph
      QUICK_CONNECT_MG_PORT: "7687"
    ports:
      - "127.0.0.1:3000:3000"
    networks: [threatlens]

networks:
  threatlens:
    driver: bridge

volumes:
  memgraph_data:
  postgres_data:

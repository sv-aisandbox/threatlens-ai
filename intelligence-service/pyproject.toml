[project]
name = "threatlens-intelligence-service"
version = "0.1.0"
description = "ThreatLens AI intelligence service: graph seed, ingestion, matching and graph queries"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.20",
    "python-dotenv>=1.0",
    "jsonschema>=4.22",
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "psycopg[binary]>=3.3.9",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "pyjwt>=2.10",
    "mcp>=2.3,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
